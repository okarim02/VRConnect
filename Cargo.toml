[package]
name = "vrconnect"
version = "1.0.0"
edition = "2021"
authors = ["UTBM Team"]
description = "Medical middleware for real-time vital data processing"

[lints.rust]
# `tarpaulin_include`/`tarpaulin_exclude` are cfg names read by cargo-tarpaulin
# (coverage tool), not the compiler — used throughout this codebase to mark
# integration-only code excluded from coverage. Not a Cargo feature, so
# check-cfg has no other way to know it's intentional.
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(tarpaulin_include)"] }

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"

# WebSocket for Socket.IO
tokio-tungstenite = "0.21"
futures-util = "0.3"

# Bluetooth Low Energy
ble-windows-server = "0.2.1"  # Legacy: used by old state-sync ble.rs only
uuid = { version = "1.6", features = ["v4"] }
# Custom GATT server with Write callback support (reliable protocol)
windows = { version = "0.58", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Foundation",
    "Storage_Streams",
    "Win32_Storage_FileSystem",
] }

# Data processing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
fancy-regex = "0.13"

# Configuration
dotenvy = "0.15"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = { version = "0.4", features = ["std"] }

# Colors
colored = "2.1"

# File compression
zip = "0.6"

# Unix system calls
libc = "0.2"

# CRC32C (Castagnoli) for IDT BLE protocol frame integrity
crc32c = "0.6"

# Binary serialization (kept for non-BLE use)
bytes = "1.5"

[dev-dependencies]
mockall = "0.12"
tempfile = "3.8"
tokio-test = "0.4"
serial_test = "3.0"
env_logger = "0.11"

[lib]
name = "vrconnect"
path = "src/lib.rs"

[[bin]]
name = "vrconnect"
path = "src/main.rs"